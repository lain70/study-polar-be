server:
  port: 8080
  
spring:  profiles:    active: local
  messages:    basename: i18n/exception
    encoding: UTF-8
    
mybatis:  type-aliases-package: com.kapay.task.models
  configuration:    map-underscore-to-camel-case: true
    jdbc-type-for-null: null
    call-setters-on-nulls: true
    
    
---
spring:  profiles: local	  datasource:    hikari:      driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
      jdbc-url: jdbc:log4jdbc:mysql://127.0.0.1:3306/kapaydb?characterEncoding=UTF-8&serverTimezone=UTC
      username: kapayuser
      password: kakapay12#$
      connection-test-query: SELECT 1
#      max-lifetime: 10000
#      connection-timeout: 5000
#      validation-timeout: 1000
#      maximum-pool-size: 30
    mapper-location: classpath:com/kapay/task/mappers/*.xml
  redis:    host: 127.0.0.1
    port: 6379
    password: kapayredis12#$
    lettuce:      pool:        max-active: 10
        max-idle: 10
        min-idle: 2
  jwt:
    secret: "kapayjwt12#$"
    strength: 10
    delay:
      refresh: 60
      access: 30
  
service-key: kapay-service-key